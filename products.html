<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Shop Mini - Nos Produits</title>
    <!-- استدعاء مكتبة Bootstrap 5 للتصميم الجاهز -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <!-- شريط العناوين العلوي -->
    <nav class="navbar navbar-dark bg-dark mb-5">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">🛒 E-Shop Mini</a>
      </div>
    </nav>

    <!-- حاوية المنتجات -->
    <div class="container-fluid">
      <h2 class="mb-4 text-center">قائمة المنتجات المميزة</h2>

      <!-- صف يحتوي على شبكة المنتجات -->
      <div class="row">
        <!-- البطاقة الأولى -->
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm h-100">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Produit numero 1</h5>
              <p class="card-text text-muted">description simple du produit</p>
              <span class="text-success fw-bold mb-3">150 DH</span>
              <a href="#" class="btn btn-primary mt-auto">Ajouter au panier</a>
            </div>
          </div>
        </div>

        <!-- البطاقة الثانية -->
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm h-100">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">منتج رقم 2</h5>
              <p class="card-text text-muted">
                وصف مصغر للمنتج الثاني يوضح مميزاته الرائعة.
              </p>
              <span class="text-success fw-bold mb-3">250 د.م</span>
              <a href="#" class="btn btn-primary mt-auto">إضافة إلى السلة</a>
            </div>
          </div>
        </div>

        <!-- البطاقة الثالثة -->
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm h-100">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">منتج رقم 3</h5>
              <p class="card-text text-muted">
                وصف مصغر للمنتج الثالث يوضح مميزاته الرائعة.
              </p>
              <span class="text-success fw-bold mb-3">350 د.م</span>
              <a href="#" class="btn btn-primary mt-auto">إضافة إلى السلة</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
